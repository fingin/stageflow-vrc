<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StageFlow · Live</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#0c1017;color:#e9eef8}body{margin:0}header{display:flex;align-items:center;gap:14px;padding:22px 5vw;border-bottom:1px solid #26303e}header b{font-size:22px;letter-spacing:-.7px}#status{margin-left:auto;color:#9aa7bb;font-size:13px}main{max-width:1400px;margin:28px auto;padding:0 4vw}video{display:block;background:#000;width:100%;max-height:75vh;aspect-ratio:16/9;border-radius:9px}footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;color:#9aa7bb}button,a{border:1px solid #344259;border-radius:7px;background:#192332;color:#e9eef8;padding:10px 15px;cursor:pointer;text-decoration:none}button:hover,a:hover{border-color:#70d6bb}#dot{width:9px;height:9px;border-radius:50%;background:#70d6bb}#message{margin:20px 0;color:#9aa7bb}code{font-size:12px;word-break:break-all}button:focus-visible,a:focus-visible{outline:2px solid #70d6bb;outline-offset:3px}
</style></head><body>
<header><span id="dot"></span><b>StageFlow</b><span>Live playback</span><span id="status">Connecting…</span></header>
<main><video id="video" controls playsinline></video><footer><button id="play">Play stream</button><button id="live">Jump to live</button><button id="copy">Copy stream URL</button><a href="/live/index.m3u8">Open playlist</a><span id="delay"></span></footer><p id="message">Press Play to start with audio.</p><code id="url"></code></main>
<script src="/hls.min.js"></script><script>
const video=document.querySelector('#video'),status=document.querySelector('#status'),message=document.querySelector('#message');
const source=new URL('/live/index.m3u8',location.href).href;document.querySelector('#url').textContent=source;
let hls=null,retryTimer=null;function connect(){clearTimeout(retryTimer);if(hls){hls.destroy();hls=null;}
if(window.Hls&&Hls.isSupported()){hls=new Hls({liveSyncDurationCount:2,liveMaxLatencyDurationCount:6,maxBufferLength:8,backBufferLength:5});hls.loadSource(source);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>{status.textContent='Ready';message.textContent='Press Play to start with audio.'});hls.on(Hls.Events.ERROR,(_,event)=>{if(event.fatal){status.textContent='Waiting for stream';message.textContent='The stream is not ready. Reconnecting automatically…';retryTimer=setTimeout(connect,2500)}})}
else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=source;video.addEventListener('error',()=>{status.textContent='Waiting for stream';retryTimer=setTimeout(connect,2500)},{once:true})}else{status.textContent='Unsupported browser';message.textContent='Open the playlist URL in an HLS-compatible player.'}}
document.querySelector('#play').onclick=async()=>{try{await video.play();message.textContent=''}catch(e){message.textContent='Playback could not start yet. Wait for the stream and try again.'}};
document.querySelector('#live').onclick=()=>{if(hls&&Number.isFinite(hls.liveSyncPosition))video.currentTime=hls.liveSyncPosition;else if(video.seekable.length)video.currentTime=Math.max(0,video.seekable.end(video.seekable.length-1)-1)};
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(source);message.textContent='Stream URL copied.'}catch{message.textContent='Copy the stream URL displayed below.'}};
video.onplaying=()=>status.textContent='Live';video.onwaiting=()=>status.textContent='Buffering';video.onpause=()=>status.textContent='Paused';
setInterval(()=>{document.querySelector('#delay').textContent=hls&&Number.isFinite(hls.latency)?hls.latency.toFixed(1)+'s behind live':''},1000);connect();
</script></body></html>
